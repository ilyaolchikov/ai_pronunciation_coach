[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pronunciation-coach"
version = "0.2.0"
description = "A local-first, evidence-based English pronunciation coach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.5,<3",
    "pydantic>=2.10,<3",
    "pronunciada==1.1.0",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
]

[project.scripts]
pronunciation-coach-audio = "pronunciation_coach.audio_cli:main"
pronunciation-coach-benchmark = "pronunciation_coach.benchmark_cli:main"
pronunciation-coach-ui = "pronunciation_coach.ui:main"

[project.optional-dependencies]
benchmark = [
    "datasets>=3.2,<5",
]
ui = [
    "gradio>=6.32,<7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pronunciation_coach"]

[tool.hatch.build.targets.wheel.shared-data]
"THIRD_PARTY_NOTICES.md" = "share/doc/pronunciation-coach/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
markers = [
    "model: tests that require the pinned model cache",
]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
extend-exclude = [".cache", ".uv-cache"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["ɪ", "ː"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
